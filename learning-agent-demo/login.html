<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 · Java 学习智能体</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark" style="width:40px;height:40px">✦</div>
        <div>
          <div class="login-title">Java 学习智能体</div>
          <div class="login-sub">本科软件工程（Java 方向）个性化学习伙伴</div>
        </div>
      </div>

      <div class="login-tabs">
        <button class="login-tab on" id="tabLogin" onclick="switchTab('login')">登录</button>
        <button class="login-tab" id="tabReg" onclick="switchTab('reg')">注册</button>
      </div>

      <form id="loginForm" class="login-form" onsubmit="return doLogin(event)">
        <div class="form-row"><label>用户名</label>
          <input class="input" id="lgUser" placeholder="请输入用户名" autocomplete="username"></div>
        <div class="form-row"><label>密码</label>
          <div class="pwd-field">
            <input class="input" id="lgPass" type="password" placeholder="请输入密码" autocomplete="current-password">
            <button type="button" class="eye-toggle" id="eyeLg" aria-label="显示密码" aria-pressed="false" title="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
            </button>
          </div></div>
        <button class="btn primary block" type="submit" id="lgBtn">登 录</button>
      </form>

      <form id="regForm" class="login-form" style="display:none" onsubmit="return doRegister(event)">
        <div class="form-row"><label>用户名</label>
          <input class="input" id="rgUser" placeholder="字母 / 数字 / 下划线，3-30 位" autocomplete="username"></div>
        <div class="form-row"><label>密码</label>
          <div class="pwd-field">
            <input class="input" id="rgPass" type="password" placeholder="至少 6 位" autocomplete="new-password">
            <button type="button" class="eye-toggle" id="eyeRg" aria-label="显示密码" aria-pressed="false" title="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
            </button>
          </div></div>
        <div class="form-row"><label>姓名</label>
          <input class="input" id="rgName" placeholder="真实姓名"></div>
        <div class="form-row"><label>角色</label>
          <select class="select" id="rgRole">
            <option value="STUDENT" selected>学生</option>
            <option value="TEACHER">教师</option>
          </select></div>
        <div class="form-row"><label>学号（学生选填）</label>
          <input class="input" id="rgNo" inputmode="numeric" placeholder="如 2023211036"></div>
        <button class="btn primary block" type="submit" id="rgBtn">注 册</button>
      </form>

      <div class="login-foot">MVP v0.1 · Spring Boot 3 + MySQL + DeepSeek</div>
    </div>
  </div>

<script src="assets/js/auth.js"></script>
<script>
function switchTab(which) {
  document.getElementById('tabLogin').className = 'login-tab' + (which === 'login' ? ' on' : '');
  document.getElementById('tabReg').className = 'login-tab' + (which === 'reg' ? ' on' : '');
  document.getElementById('loginForm').style.display = which === 'login' ? '' : 'none';
  document.getElementById('regForm').style.display = which === 'reg' ? '' : 'none';
}

/* 密码可见性切换（小眼睛按钮）：
 * - pointerdown preventDefault 阻止按钮抢占焦点，点击后输入框保持聚焦（输入流程不被打断）
 * - 切换 input.type 并同步 aria-label / aria-pressed / title（无障碍状态说明）
 * - 图标交叉过渡由 CSS .eye-toggle.show 驱动（opacity + scale 平滑切换） */
function bindEye(toggleId, inputId) {
  const t = document.getElementById(toggleId);
  const inp = document.getElementById(inputId);
  if (!t || !inp) return;
  t.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  t.addEventListener('click', function () {
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    t.classList.toggle('show', show);
    t.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    t.setAttribute('aria-pressed', show ? 'true' : 'false');
    t.title = show ? '隐藏密码' : '显示密码';
  });
}
bindEye('eyeLg', 'lgPass');
bindEye('eyeRg', 'rgPass');

function setBtn(btn, text, disabled) {
  btn.disabled = !!disabled;
  btn.textContent = text;
}

async function api(path, body) {
  const res = await fetch('/api' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json;charset=utf-8' },
    body: JSON.stringify(body)
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || !data || data.code !== 0) {
    throw new Error((data && data.msg) || ('请求失败 (' + res.status + ')'));
  }
  return data.data;
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('lgBtn');
  setBtn(btn, '登录中…', true);
  try {
    const r = await api('/auth/login', {
      username: document.getElementById('lgUser').value.trim(),
      password: document.getElementById('lgPass').value
    });
    Auth.save(r.token, r.user);
    location.href = 'index.html';
  } catch (err) {
    alert(err.message);
    setBtn(btn, '登 录', false);
  }
  return false;
}

async function doRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('rgBtn');
  setBtn(btn, '注册中…', true);
  try {
    const r = await api('/auth/register', {
      username: document.getElementById('rgUser').value.trim(),
      password: document.getElementById('rgPass').value,
      realName: document.getElementById('rgName').value.trim(),
      role: document.getElementById('rgRole').value,
      studentNo: document.getElementById('rgNo').value.trim() || null,
      classId: document.getElementById('rgRole').value === 'STUDENT' ? 1 : null
    });
    const r2 = await api('/auth/login', {
      username: document.getElementById('rgUser').value.trim(),
      password: document.getElementById('rgPass').value
    });
    Auth.save(r2.token, r2.user);
    location.href = 'index.html';
  } catch (err) {
    alert(err.message);
    setBtn(btn, '注 册', false);
  }
  return false;
}
</script>
</body>
</html>
